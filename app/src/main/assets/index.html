<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Sekiro Route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column — sticky posture-bar header, "next up" card, collapsible area sections, each step a tappable row with a sculptor's-idol diamond as its checkbox */
:root{
  --bg:#e7ebe6;        /* Ashina mist */
  --surface:#f4f6f2;
  --line:#c9d0c8;
  --ink:#1b2320;
  --muted:#5c6a63;
  --posture:#b7790d;   /* posture-bar amber: progress + done */
  --posture-soft:#f0dfb8;
  --peril:#b42b1f;     /* 危 perilous red: bosses + warnings */
  --peril-soft:#f3d6d1;
  --key:#2e5b6e;       /* key items: steel blue */
  --key-soft:#d3e2e8;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715;--surface:#1a211e;--line:#2c3631;--ink:#e3e8e3;--muted:#93a199;
  --posture:#e2a32c;--posture-soft:#3b2f15;--peril:#ec6a5c;--peril-soft:#3d1d19;--key:#84b6c9;--key-soft:#1c3038;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715;--surface:#1a211e;--line:#2c3631;--ink:#e3e8e3;--muted:#93a199;
  --posture:#e2a32c;--posture-soft:#3b2f15;--peril:#ec6a5c;--peril-soft:#3d1d19;--key:#84b6c9;--key-soft:#1c3038;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--posture);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;
  margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.hrow{max-width:640px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:800;font-size:1.55rem;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--peril);margin-left:.3em;font-size:1.1rem}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.count b{color:var(--ink);font-size:1.05rem}
.posture{max-width:640px;margin:10px auto 0;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.posture i{position:absolute;inset:0 auto 0 50%;transform:translateX(-50%);background:var(--posture);border-radius:4px;transition:width .35s ease}
.posture::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--bg);transform:translateX(-50%)}

.next{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.next .what{font-family:var(--font-display);font-size:1.2rem;font-weight:700;line-height:1.3}
.next .where{color:var(--muted);font-size:.88rem}
.next .note{font-size:.9rem}
.next .act{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:.9rem}
.btn.primary{background:var(--posture);border-color:var(--posture);color:#1b1404}
.btn.danger{background:var(--peril);border-color:var(--peril);color:var(--bg)}

.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:.85rem;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hide{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);cursor:pointer}

section.area{border-top:1px solid var(--line)}
section.area>button.ahead{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 0;cursor:pointer}
section.area>button.ahead:focus-visible{outline:2px solid var(--posture);outline-offset:2px}
.num{font-family:var(--font-display);font-weight:800;color:var(--muted);font-size:.95rem;width:1.6em;text-align:right;font-variant-numeric:tabular-nums}
.aname{min-width:0}
.aname h2{font-family:var(--font-display);font-size:1.12rem;margin:0;font-weight:700;text-wrap:balance}
.aname p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
.aprog{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:.8rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.mini-bar{width:56px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--posture)}
.area.complete .aname h2{color:var(--muted)}
.area.complete .aprog{color:var(--posture);font-weight:700}
.chev{transition:transform .2s}
section.area[data-open="1"] .chev{transform:rotate(180deg)}

ol.steps{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:2px}
li.step{display:grid;grid-template-columns:28px 1fr;column-gap:10px;padding:0 8px;border-radius:8px}
li.step:hover,li.step.open{background:var(--surface)}
li.step label.chk{display:block;padding:10px 0;cursor:pointer;align-self:stretch}
li.step input{position:absolute;opacity:0;width:1px;height:1px}
li.step button.body{all:unset;box-sizing:border-box;padding:10px 0;cursor:pointer}
li.step button.body:focus-visible{outline:2px solid var(--posture);outline-offset:2px}
.idol{display:block;width:16px;height:16px;margin:4px 0 0 5px;transform:rotate(45deg);border:2px solid var(--muted);border-radius:2px;transition:background .15s,border-color .15s}
li.step input:checked + .idol{background:var(--posture);border-color:var(--posture)}
li.step.part .chk .idol{background:linear-gradient(135deg,var(--posture) 50%,transparent 50%);border-color:var(--posture)}
li.step input:focus-visible + .idol{outline:2px solid var(--posture);outline-offset:3px}
.body{min-width:0;display:flex;flex-direction:column;gap:3px}
.t{font-weight:500}
li.step.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.detail{grid-column:2;display:flex;flex-direction:column;gap:8px;padding:0 0 12px}
.detail .n{margin:0}
ul.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.subs label{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:6px 0;cursor:pointer;align-items:start;font-size:.9rem}
.idol.sm{width:12px;height:12px;margin:5px 0 0 4px}
ul.subs input:checked ~ .st{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
a.wiki{color:var(--key);font-weight:700;font-size:.86rem;text-decoration:none;align-self:flex-start;padding:4px 0}
a.wiki:hover{text-decoration:underline}
.tag.cnt{background:var(--posture-soft);color:var(--ink);font-variant-numeric:tabular-nums}
.n{color:var(--muted);font-size:.86rem}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--line);color:var(--ink)}
.tag.boss{background:var(--peril);color:var(--bg)}
.tag.mini{background:var(--peril-soft);color:var(--peril)}
.tag.key{background:var(--key-soft);color:var(--key)}
.tag.opt{background:transparent;border:1px solid var(--line);color:var(--muted)}
.warn{display:flex;gap:6px;align-items:baseline;font-size:.85rem;color:var(--peril);font-weight:500}
.warn b{font-family:var(--font-display);font-size:1rem}

.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font-size:.8rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
footer{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px;font-size:.82rem;color:var(--muted)}
footer a{color:inherit}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--peril-soft);padding:10px 12px;border-radius:8px;color:var(--ink)}
.empty{color:var(--muted);font-size:.88rem;padding:6px 8px 14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<header>
  <div class="hrow">
    <h1>Sekiro Route<span aria-hidden="true">隻狼</span></h1>
    <div class="count"><b id="doneCount">0</b> / <span id="totalCount">0</span> required</div>
  </div>
  <div class="posture" role="progressbar" aria-label="Required steps done" aria-valuemin="0" aria-valuemax="100" id="pbar"><i id="pfill" style="width:0%"></i></div>
</header>

<div class="wrap">
  <div class="next" id="next" aria-live="polite"></div>

  <div class="controls">
    <div class="seg" role="group" aria-label="Show">
      <button type="button" id="f-all" data-f="all" aria-pressed="true">All</button>
      <button type="button" id="f-req" data-f="req" aria-pressed="false">Required</button>
      <button type="button" id="f-boss" data-f="boss" aria-pressed="false">Bosses</button>
    </div>
    <label class="hide"><input type="checkbox" id="hideDone"> Hide done</label>
  </div>

  <div id="areas"></div>

  <div class="legend" aria-label="Legend">
    <span><span class="tag boss">Boss</span></span>
    <span><span class="tag mini">Mini-boss</span></span>
    <span><span class="tag key">Key item</span></span>
    <span><span class="tag opt">Optional</span></span>
    <span class="warn"><b>危</b> Missable or point of no return</span>
  </div>

  <footer>
    <div id="saveState">Progress is saved on this device.</div>
    <div id="resetBox"><button type="button" class="btn" id="resetBtn">Reset progress</button></div>
    <div>Route written in our own words from the <a href="https://sekiro-shadows-die-twice.fandom.com/">Fandom Sekiro wiki</a> (CC BY-SA). Spoilers for every area.</div>
  </footer>
</div>

<script src="route.js"></script>
<script>

const KEY="sekiro-route-v1";
const state={done:{},updated:0,filter:"all",hideDone:false,open:{},detail:null};
let storeDoc=null;

function readLocal(){try{const v=JSON.parse(localStorage.getItem(KEY)||"null");if(v&&v.done)return v}catch(e){}return null}
function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify({done:state.done,updated:state.updated,filter:state.filter,hideDone:state.hideDone,open:state.open}))}catch(e){}}
const loc=readLocal();
if(loc){state.done=loc.done||{};state.updated=loc.updated||0;state.filter=loc.filter||"all";state.hideDone=!!loc.hideDone;state.open=loc.open||{}}

const allSteps=ROUTE.flatMap(a=>a.steps.map(s=>({...s,area:a})));
const stepById={},parentOf={};
allSteps.forEach(s=>{stepById[s.id]=s;(s.sub||[]).forEach(x=>parentOf[x.id]=s)});
/* A step with sub-steps is done exactly when all its sub-steps are; also upgrades progress saved before a step had sub-steps. */
function reconcile(){allSteps.forEach(s=>{if(!s.sub)return;if(state.done[s.id]&&!s.sub.some(x=>state.done[x.id]))s.sub.forEach(x=>state.done[x.id]=1);if(s.sub.every(x=>state.done[x.id]))state.done[s.id]=1;else delete state.done[s.id]})}
reconcile();
const WIKI="https://sekiro-shadows-die-twice.fandom.com/wiki/Special:Search?go=Go&search=";
function wikiURL(s){const q=s.wiki||((s.k==="boss"||s.k==="mini")?s.t.replace(/\s*\(.*?\)$/,"").replace(/ – /g," - "):s.area.wiki||s.area.name);return WIKI+encodeURIComponent(q)}
const required=allSteps.filter(s=>!s.opt);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KLABEL={boss:"Boss",mini:"Mini-boss",key:"Key item"};

function visible(s){
  if(state.filter==="req"&&s.opt)return false;
  if(state.filter==="boss"&&!(s.k==="boss"||s.k==="mini"))return false;
  if(state.hideDone&&state.done[s.id])return false;
  return true;
}
function stepHTML(s){
  const tags=[],subs=s.sub||[],sd=subs.filter(x=>state.done[x.id]).length,done=!!state.done[s.id],open=state.detail===s.id;
  if(KLABEL[s.k])tags.push(`<span class="tag ${s.k}">${KLABEL[s.k]}</span>`);
  if(s.opt)tags.push(`<span class="tag opt">Optional</span>`);
  if(subs.length)tags.push(`<span class="tag cnt">${sd}/${subs.length}</span>`);
  const cls=["step"];if(done)cls.push("done");else if(sd)cls.push("part");if(open)cls.push("open");
  return `<li class="${cls.join(" ")}"><label class="chk"><input type="checkbox" id="c-${s.id}" data-id="${s.id}" ${done?"checked":""} aria-label="Done: ${esc(s.t)}"><span class="idol" aria-hidden="true"></span></label>
  <button type="button" class="body" data-detail="${s.id}" aria-expanded="${open}"><span class="t">${esc(s.t)}</span>${tags.length?`<span class="tags">${tags.join("")}</span>`:""}${s.w?`<span class="warn"><b aria-label="Warning">危</b>${esc(s.w)}</span>`:""}</button>${open?detailHTML(s):""}</li>`;
}
function detailHTML(s){
  const subs=s.sub||[];
  return `<div class="detail">${s.n?`<p class="n">${esc(s.n)}</p>`:""}${subs.length?`<ul class="subs">${subs.map(x=>`<li><label><input type="checkbox" data-id="${x.id}" ${state.done[x.id]?"checked":""}><span class="idol sm" aria-hidden="true"></span><span class="st">${esc(x.t)}</span></label></li>`).join("")}</ul>`:""}<a class="wiki" href="${wikiURL(s)}" target="_blank" rel="noopener">Open on Fandom wiki ↗</a></div>`;
}
function firstOpenArea(){const s=required.find(s=>!state.done[s.id]);return s?s.area.id:null}

function render(){
  const doneReq=required.filter(s=>state.done[s.id]).length;
  $("doneCount").textContent=doneReq;$("totalCount").textContent=required.length;
  const pct=Math.round(doneReq/required.length*100);
  $("pfill").style.width=pct+"%";$("pbar").setAttribute("aria-valuenow",pct);

  const nx=required.find(s=>!state.done[s.id]);
  const nsub=nx&&nx.sub?nx.sub.find(x=>!state.done[x.id]):null;
  $("next").innerHTML=nx?`<div class="eyebrow">Next up · ${esc(nx.area.name)}</div><div class="what">${esc(nx.t)}</div>${nsub?`<div class="note"><b>Now:</b> ${esc(nsub.t)} <span class="where">(${nx.sub.indexOf(nsub)+1} of ${nx.sub.length})</span></div>`:""}${nx.n?`<div class="note">${esc(nx.n)}</div>`:""}${nx.w?`<div class="warn"><b>危</b>${esc(nx.w)}</div>`:""}<div class="act"><button type="button" class="btn primary" id="nextDone" data-id="${nsub?nsub.id:nx.id}">Mark done</button><button type="button" class="btn" id="nextJump" data-area="${nx.area.id}" data-step="${nx.id}">Show in list</button></div>`
    :`<div class="eyebrow">Route complete</div><div class="what">Every required step is done.</div><div class="note">Check the Endings section or start New Game Plus.</div>`;

  const cur=firstOpenArea();
  $("areas").innerHTML=ROUTE.map((a,i)=>{
    const req=a.steps.filter(s=>!s.opt),dr=req.filter(s=>state.done[s.id]).length;
    const all=a.steps.length,da=a.steps.filter(s=>state.done[s.id]).length;
    const total=req.length||all,d=req.length?dr:da;
    const open=state.open[a.id]!==undefined?state.open[a.id]:a.id===cur;
    const vis=a.steps.filter(visible);
    const complete=d===total;
    return `<section class="area${complete?" complete":""}" id="a-${a.id}" data-open="${open?1:0}">
      <button type="button" class="ahead" aria-expanded="${open}" data-area="${a.id}">
        <span class="num">${i+1}</span>
        <span class="aname"><h2>${esc(a.name)}</h2><p>${esc(a.sub)}</p></span>
        <span class="aprog"><span>${complete?"Done":`${d}/${total}`}</span><span class="mini-bar"><i style="width:${Math.round(d/total*100)}%"></i></span></span>
      </button>
      <div ${open?"":"hidden"}>${vis.length?`<ol class="steps">${vis.map(stepHTML).join("")}</ol>`:`<div class="empty">Nothing to show with these filters.</div>`}</div>
    </section>`;
  }).join("");

  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===state.filter));
  $("hideDone").checked=state.hideDone;
}

function mark(id,val){if(val)state.done[id]=1;else delete state.done[id]}
function setDone(id,val){
  mark(id,val);
  const s=stepById[id],p=parentOf[id];
  if(s&&s.sub)s.sub.forEach(x=>mark(x.id,val));
  if(p)mark(p.id,p.sub.every(x=>state.done[x.id]));
  state.updated=Date.now();writeLocal();queueSync();render();
}

document.addEventListener("change",e=>{
  if(e.target.dataset.id){setDone(e.target.dataset.id,e.target.checked)}
  else if(e.target.id==="hideDone"){state.hideDone=e.target.checked;writeLocal();render()}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.classList.contains("ahead")){const id=b.dataset.area,sec=$("a-"+id);state.open[id]=sec.dataset.open!=="1";writeLocal();render();return}
  if(b.dataset.f){state.filter=b.dataset.f;writeLocal();render();return}
  if(b.dataset.detail){toggleDetail(b.dataset.detail);return}
  if(b.id==="nextDone"){setDone(b.dataset.id,true);return}
  if(b.id==="nextJump"){state.open[b.dataset.area]=true;if(state.detail!==b.dataset.step)toggleDetail(b.dataset.step);else render();$("a-"+b.dataset.area).scrollIntoView({behavior:"smooth",block:"start"});return}
  if(b.id==="resetBtn"){$("resetBox").innerHTML=`<div class="confirm"><span>Clear every checkmark?</span><button type="button" class="btn danger" id="resetYes">Clear progress</button><button type="button" class="btn" id="resetNo">Keep</button></div>`;return}
  if(b.id==="resetYes"){state.done={};state.open={};state.updated=Date.now();writeLocal();queueSync();resetBack();render();return}
  if(b.id==="resetNo"){resetBack();return}
});
/* One step's details open at a time. Opening one adds a history entry, so the browser's or Android's back closes it. */
function toggleDetail(id){
  if(state.detail===id){history.back();return}
  try{if(state.detail)history.replaceState({d:id},"");else history.pushState({d:id},"")}catch(e){}
  showDetail(id);
}
function showDetail(id){
  state.detail=id;render();
  const b=id&&document.querySelector(`[data-detail="${id}"]`);if(b)b.focus({preventScroll:true});
}
window.addEventListener("popstate",e=>showDetail(e.state&&e.state.d||null));
function resetBack(){$("resetBox").innerHTML=`<button type="button" class="btn" id="resetBtn">Reset progress</button>`}

/* Sync to the viewer's own account when the page runs on claude.ai; plain device storage otherwise (e.g. inside the Android app). */
let syncTimer=null,inflight=false,again=false;
function queueSync(){if(!storeDoc)return;clearTimeout(syncTimer);syncTimer=setTimeout(pushSync,600)}
async function pushSync(){
  if(inflight){again=true;return}
  inflight=true;
  try{await storeDoc.set({done:{...state.done},updated:state.updated});$("saveState").textContent="Progress is saved to your Claude account and syncs across devices."}
  catch(e){$("saveState").textContent="Saved on this device. Account sync is unavailable right now."}
  inflight=false;if(again){again=false;pushSync()}
}
async function connect(){
  if(!window.claude||!window.claude.use)return;
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    storeDoc=db.doc("data/users/"+uid+"/progress");
    const snap=await storeDoc.get();
    const remote=snap.exists?snap.data():null;
    if(remote&&(remote.updated||0)>state.updated){state.done={...(remote.done||{})};state.updated=remote.updated||0;reconcile();writeLocal();render()}
    else if(state.updated>0){pushSync()}
    $("saveState").textContent="Progress is saved to your Claude account and syncs across devices.";
  }catch(e){storeDoc=null}
}
if(history.state&&history.state.d&&stepById[history.state.d])state.detail=history.state.d;
render();connect();
</script>
</body></html>
