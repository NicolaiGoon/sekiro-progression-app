plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sekiroroute.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sekiroroute.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies: plain Android WebView, so the APK stays tiny.
